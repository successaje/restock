<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Restock — Naira in. Stock secured.</title>
    <meta
      name="description"
      content="Restock protects solar installers' naira installment income from devaluation. Every installment is converted to dollars the moment it lands, and suppliers are paid from a wallet you control. Built on Celo."
    />
    <meta name="theme-color" content="#FCF6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Restock — Naira in. Stock secured." />
    <meta
      property="og:description"
      content="Solar installers sell in naira and restock in dollars. Restock converts every installment as it arrives, so the next shipment is already paid for."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the saved or system theme before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("restock-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Restock needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
